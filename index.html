<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fechamento de Caixa</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1d5fb8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fechamento">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
<script src="js/vendor/xlsx.full.min.js"></script>
<script src="js/vendor/chart.umd.min.js"></script>
<script src="js/vendor/jspdf.umd.min.js"></script>
<script src="js/vendor/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo"><span class="logo-mark">FC</span><div><strong>Fechamento</strong><br><span>de Caixa</span></div></div>
    <nav class="nav">
      <button data-view="overview"><i>▦</i> Visão geral</button>
      <button data-view="files"><i>⇪</i> Arquivos</button>
      <button data-view="issues"><i>⚑</i> Divergências Caixa <em id="nav-issues-count" class="count"></em></button>
      <button data-view="notes"><i>🧾</i> Divergências Notas <em id="nav-notes-count" class="count"></em></button>
      <button data-view="history"><i>↻</i> Histórico</button>
      <button data-view="report"><i>▤</i> Relatório</button>
    </nav>
    <div id="install-hint" class="side-foot" hidden style="margin-bottom:8px">📲 Para instalar no iPhone/iPad: toque em <b>Compartilhar</b> e em <b>Adicionar à Tela de Início</b>.</div>
    <div class="side-foot">🔒 Conferência somente leitura.<br>Seus arquivos são processados no navegador e nunca são alterados ou enviados.</div>
  </aside>
  <main>
    <header class="topbar">
      <h1 id="title">Visão geral</h1>
      <div class="top-r"><span id="status" class="pill grey">Aguardando arquivos</span><button id="btn-install" class="btn" hidden>⬇ Instalar app</button><button id="btn-clear" class="btn danger" data-action="clear" disabled>Apagar dados</button><button id="btn-pdf" class="btn primary" data-action="pdf" disabled>Relatório PDF</button></div>
    </header>
    <section id="view" class="content"></section>
  </main>
</div>
<div id="busy" class="busy" hidden><div class="busy-box"><strong id="busy-t">Lendo arquivo…</strong><div class="bar"><i id="busy-b" style="width:0%"></i></div><span id="busy-s" class="muted small"></span></div></div>
<div id="toast" class="toast"></div>
<script src="js/utils.js"></script>
<script src="js/parsers.js"></script>
<script src="js/pdfprofiles.js"></script>
<script src="js/engine.js"></script>
<script src="js/charts.js"></script>
<script src="js/demo.js"></script>
<script src="js/report.js"></script>
<script src="js/notes.js"></script>
<script src="js/app.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
